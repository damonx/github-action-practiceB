name: Demo Worrkflow filters
on:
    pull_request:
        types:
            - opened
        branches:
            - main
            - 'dev-*'
            - 'feat/**'
            - 'dev'
            - 'dev/**'
    workflow_dispatch:
    push:
        branches:
            - main
            - 'dev-*'
            - 'feat/**'
            - 'dev'
            - 'dev/**'
        paths-ignore:
            - '.github/workflows/*'
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Output the event data
              run: echo "The event data is ${{ toJson(github.event) }}"
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Install dependencies
              run: npm ci
            - name: Test the code
              run: npm run test
            - name: Build the code
              run: npm run build
            - name: Deploy the code
              run: echo "Deploying the code..."
